name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes — under Render's 15-min sleep window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf https://career-advisor-api.onrender.com/api/status
