[project]
name = "career-advisor"
version = "2.0.0"
description = "AI Career Advisor Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.0.1",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "chromadb>=0.4.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.19.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "langsmith>=0.1.60",
    "mcp>=1.2.0,<2.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by black

[tool.ruff.lint.isort]
known-first-party = [
    "config", "errors", "llm_providers", "rag_pipeline", "rag_service",
    "career_tools", "resume_pipeline", "jobs_data", "tracing", "evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
